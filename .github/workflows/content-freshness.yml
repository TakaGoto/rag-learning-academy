name: Content Freshness Check

# Monthly report: find content past its review cycle (last_reviewed +
# review_cycle frontmatter) and keep ONE tracking issue up to date.
# Fixing is done by scripts/freshness_routine.sh, which runs Claude Code on a
# maintainer's machine (subscription, no API key) and opens + merges a PR.

on:
  schedule:
    - cron: '0 9 1 * *'  # 1st of each month at 9 AM UTC
  workflow_dispatch:

concurrency:
  group: content-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      REPORT_TITLE: "Monthly Content Freshness Report — ${{ github.event.repository.name }}"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # git history is the fallback date for files without frontmatter

      - name: Find content past its review cycle
        id: check
        run: bash .github/scripts/content_freshness.sh --report freshness-report.md --stale-list stale-files.txt

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: freshness-report.md

      - name: Look up the existing tracking issue
        id: issue
        run: |
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label content-review \
                  --search "\"$REPORT_TITLE\" in:title" --json number --jq '.[0].number // empty')
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Add the how-to-fix note
        if: steps.check.outputs.stale_count != '0' || steps.check.outputs.deprecated_count != '0'
        run: |
          {
            echo
            echo "> Fix: run \`scripts/freshness_routine.sh\` on a maintainer's machine (or let its monthly launchd job run). It reviews these files with Claude Code, opens a PR, and merges it once CI is green. See README → Content Freshness."
          } >> freshness-report.md

      - name: Create or update the tracking issue
        if: steps.check.outputs.stale_count != '0' || steps.check.outputs.deprecated_count != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: ${{ env.REPORT_TITLE }}
          content-filepath: freshness-report.md
          labels: content-review,automated
          issue-number: ${{ steps.issue.outputs.number }}

      - name: Close the tracking issue when everything is current
        if: steps.check.outputs.stale_count == '0' && steps.check.outputs.deprecated_count == '0' && steps.issue.outputs.number != ''
        run: |
          gh issue close "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --comment "Every content file is within its review cycle as of ${{ steps.check.outputs.today }}. Closing."
